# Монорепо: подключает CI/CD-конфиги пакетов. Каждый пакет самодостаточен и описывает свои же
# job'ы (backend/.gitlab-ci.yml, frontend/.gitlab-ci.yml) — здесь только точка входа.
#
# Требует, чтобы в настройках проекта GitLab (Settings → CI/CD → General pipelines →
# "CI/CD configuration file") путь был выставлен на дефолтный `.gitlab-ci.yml` (или пустым) —
# раньше он был захардкожен на `backend/.gitlab-ci.yml`, из-за чего у фронта своего пайплайна
# не было.
#
# `stages:` продублирован здесь намеренно: у GitLab при `include` нескольких файлов, каждый из
# которых сам объявляет `stages:`, побеждает не объединение, а последний по порядку include —
# стадии предыдущего файла молча теряются (см. gitlab-org/gitlab#29980). Ключи, объявленные в
# корневом файле, имеют приоритет над include'ами, поэтому объявляем полный список стадий здесь.

stages:
  - build
  - test
  - migrate
  - deploy

include:
  - local: 'backend/.gitlab-ci.yml'
  - local: 'frontend/.gitlab-ci.yml'
