services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: blizka
      POSTGRES_USER: blizka
      POSTGRES_PASSWORD: blizka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizka -d blizka"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      BLIZKA_DB_CONNECTION: "Host=postgres;Port=5432;Database=blizka;Username=blizka;Password=blizka"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
