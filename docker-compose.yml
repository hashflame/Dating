services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: blizka
      POSTGRES_USER: blizka
      POSTGRES_PASSWORD: blizka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blizka -d blizka"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile.migrator
    environment:
      BLIZKA_DB_CONNECTION: "Host=postgres;Port=5432;Database=blizka;Username=blizka;Password=blizka"
    depends_on:
      postgres:
        condition: service_healthy

  # S3-совместимое хранилище фото (T-3.1) для локальной разработки — в проде используется реальный S3-провайдер,
  # см. секцию Storage в appsettings.yaml.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт бакет blizka-photos и включает анонимное скачивание (публичные URL фото
  # отдаются напрямую из MinIO без прокси через API) — по аналогии с сервисом migrator выше.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/blizka-photos &&
      mc anonymous set download local/blizka-photos
      "

volumes:
  postgres-data:
  minio-data:
