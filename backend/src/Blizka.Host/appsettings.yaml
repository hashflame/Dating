Logging:
  LogLevel:
    Default: Information
    Microsoft.AspNetCore: Warning

AllowedHosts: "*"

Serilog:
  MinimumLevel:
    Default: Information
    Override:
      Microsoft.AspNetCore: Warning
      Microsoft.EntityFrameworkCore: Warning
  Enrich:
    - FromLogContext
    - WithEnvironmentName
  WriteTo:
    - Name: Console

Database:
  ConnectionString: "Host=localhost;Port=5432;Database=blizka;Username=blizka;Password=blizka"

Jwt:
  Secret: ""
  Issuer: "blizka"
  Audience: "blizka-clients"
  TtlHours: 24

Telegram:
  BotToken: ""
  WebhookSecret: ""
  PaymentProviderToken: ""

Storage:
  Provider: S3
  Endpoint: ""
  Bucket: blizka-photos
  AccessKey: ""
  SecretKey: ""
  PublicBaseUrl: ""

Ai:
  Provider: OpenAI
  ApiKey: ""
  Model: gpt-4o-mini

Geo:
  NominatimBaseUrl: "https://nominatim.openstreetmap.org"
  # По usage policy Nominatim User-Agent должен однозначно идентифицировать приложение — заполнить реальным
  # контактом (сайт/email) перед продакшн-деплоем.
  NominatimUserAgent: "Blizka/1.0 (Telegram dating mini-app)"

Cors:
  AllowedOrigins:
    - "https://web.telegram.org"
    - "https://dating-frontend-production-21e8.up.railway.app"

Sparks:
  # Стоимость суперлайка (T-5.2) — spec.md 15.2 оставляет сумму конфигурируемой, без дефолта.
  SuperlikeCost: 5
  # Стоимость разблокировки входящих лайков навсегда (T-6.1) — ✦10 задано буквально в decomposition.md.
  LikesRevealCost: 10
  # Стоимость открытия контакта в мэтче (T-7.3) — ✦1 задано буквально в decomposition.md.
  ContactUnlockCost: 1
  # Таблица начислений (T-8.1, decomposition.md 15.2): «registration 50, profile 2+2+2, verification 3, referral 2, idea 1/10».
  RegistrationBonusAmount: 50
  ProfileCompletionThresholdBonusAmount: 2
  VerificationBonusAmount: 3
  ReferralBonusAmount: 2
  IdeaSubmissionBonusAmount: 1
  IdeaImplementedBonusAmount: 10
