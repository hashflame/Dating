# CI/CD для Blizka.Host — см. docs/specs/001-railway-deployment.md и docs/deployment/railway.md.
#
# Стадии: build → test → migrate → deploy.
# `migrate` и `deploy` — manual jobs, доступны только на main: инженер сначала вручную запускает
# `migrate` (применяет EF Core миграции к prod БД), и только при его успехе `deploy` становится
# доступен (см. `needs` ниже — это делает `deploy` заблокированным, пока `migrate` не отработал).

stages:
  - build
  - test
  - migrate
  - deploy

.dotnet-image:
  image: mcr.microsoft.com/dotnet/sdk:10.0

# Debug-конфигурация (дефолт dotnet build/test) — SixLabors.ImageSharp без лицензии в ней только
# предупреждает, а не падает (ошибкой это становится лишь при Release-публикации, см. Dockerfile и
# docs/deployment/railway.md), так что build/test не требуют секрета лицензии.
build:
  extends: .dotnet-image
  stage: build
  script:
    - cd backend
    - dotnet restore
    - dotnet build --no-restore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

test:
  extends: .dotnet-image
  stage: test
  needs: ["build"]
  script:
    - cd backend
    - dotnet test --no-restore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

migrate:
  # Раньше эта джоба собирала Dockerfile.migrator во вложенном docker:27-dind, но сеть
  # между job-контейнером и dind на shared-раннерах GitLab.com оказалась нестабильной для
  # внешних HTTPS-запросов (dotnet restore к nuget.org): сперва фрагментация пакетов при
  # TLS-хендшейке вешала restore на "Determining projects to restore...", затем (после
  # --mtu=1450) restore стал просто отваливаться по таймауту (NU1301) после долгих ретраев.
  # build/test восстанавливают те же пакеты без проблем в том же образе dotnet-sdk, но без
  # dind — поэтому здесь просто гоняем dotnet ef напрямую, без Docker-in-Docker.
  # Dockerfile.migrator остаётся для локального `docker compose up --build migrator`.
  extends: .dotnet-image
  stage: migrate
  needs: ["test"]
  variables:
    BLIZKA_DB_CONNECTION: $BLIZKA_DB_CONNECTION_PROD
  script:
    - cd backend
    - dotnet restore src/Blizka.Host/Blizka.Host.csproj
    - dotnet tool install --global dotnet-ef
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet ef database update --project src/Blizka.Data/Blizka.Data.csproj --startup-project src/Blizka.Host/Blizka.Host.csproj
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production

deploy:
  stage: deploy
  image: node:22-alpine
  needs: ["migrate"]
  script:
    - npm install -g @railway/cli
    - cd backend
    - railway up --service "$RAILWAY_SERVICE" --ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  environment:
    name: production
    url: $RAILWAY_PUBLIC_URL
