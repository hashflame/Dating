# CI/CD для Blizka.Host — см. backend/docs/specs/001-railway-deployment.md и
# backend/docs/deployment/railway.md.
#
# Перенесено с GitLab CI/CD (см. историю git) на GitHub Actions.
# Порядок: build → test → migrate → deploy.
# `migrate` и `deploy` доступны только на main и требуют ручного подтверждения через
# GitHub Environments (production) — задай защиту environment "production" с required
# reviewers в Settings → Environments, чтобы получить тот же ручной гейт, что был в GitLab.

name: Backend CI/CD

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v4
      - run: dotnet restore
      - run: dotnet build --no-restore

  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - run: dotnet restore
      - run: dotnet test

  migrate:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      BLIZKA_DB_CONNECTION: ${{ secrets.BLIZKA_DB_CONNECTION_PROD }}
    steps:
      - uses: actions/checkout@v4
      - run: dotnet restore src/Blizka.Host/Blizka.Host.csproj
      - run: dotnet tool install --global dotnet-ef
      - run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: dotnet ef database update --project src/Blizka.Data/Blizka.Data.csproj --startup-project src/Blizka.Host/Blizka.Host.csproj

  deploy:
    runs-on: ubuntu-latest
    needs: [migrate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.RAILWAY_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @railway/cli
      - run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
