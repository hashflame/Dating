# CI/CD для фронтенда Blizka — см. frontend/docs/deployment/railway.md.
#
# Стадии: build → deploy. `deploy` запускается автоматически на main (в отличие от бэкендового
# пайплайна, см. backend/.gitlab-ci.yml, — там `deploy` manual из-за шага миграций БД; у фронта
# состояния нет, откатывать нечего, так что ручной гейт не нужен).
#
# Job'ы названы с префиксом frontend: — этот файл подключается в корневой .gitlab-ci.yml вместе
# с backend/.gitlab-ci.yml через include, а GitLab при совпадении имён job'ов из разных include
# молча берёт последний, так что общие имена вроде build/deploy собрались бы в один job.

stages:
  - build
  - deploy

.frontend-node-image:
  image: node:22-alpine

frontend:build:
  extends: .frontend-node-image
  stage: build
  script:
    - cd frontend
    - npm ci
    - npm run check
    - npm run build
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

frontend:deploy:
  stage: deploy
  image: node:22-alpine
  needs: ['frontend:build']
  script:
    - npm install -g @railway/cli
    - cd frontend
    # Railway CLI сам всегда читает именно $RAILWAY_TOKEN для авторизации — у бэкенда уже занята
    # переменная с этим именем (свой токен, свой Railway-проект), поэтому токен фронта хранится
    # под отдельным именем RAILWAY_TOKEN_FRONTEND и подставляется в RAILWAY_TOKEN только здесь.
    - export RAILWAY_TOKEN="$RAILWAY_TOKEN_FRONTEND"
    - railway up --service "$RAILWAY_SERVICE_FRONTEND" --ci
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  environment:
    name: production
    url: $RAILWAY_PUBLIC_URL_FRONTEND
